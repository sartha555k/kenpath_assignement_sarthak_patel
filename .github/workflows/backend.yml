name: Application checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sweety
          POSTGRES_PASSWORD: sweety
          POSTGRES_DB: sweety_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sweety -d sweety_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://sweety:sweety@localhost:5432/sweety_test
      DATABASE_URL: postgresql://sweety:sweety@localhost:5432/sweety_test
      JWT_SECRET: ci-test-secret-only-not-for-production-12345
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run db:migrate
      - run: npm run db:migrate
      - run: npm run db:seed
      - run: npm test
      - run: npm run test:client
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: sweety-ci-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: docker-ci-secret-only-not-for-production-12345
      # Exercises credential URL escaping in the API image entrypoint.
      POSTGRES_PASSWORD: 'docker-test:p@ss/with?reserved%value'
      SMOKE_STATE_FILE: /tmp/sweety-docker-state.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start the entire app
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: Check migration reruns and add demo data
        run: |
          docker compose run --rm --no-deps migrate
          docker compose run --rm --no-deps -e NODE_ENV=development api node server/scripts/seed.js
          docker compose run --rm --no-deps -e NODE_ENV=development api node server/scripts/seed-range.js --from 2024-10-14 --to 2024-10-15
      - name: Exercise frontend, proxy and API
        run: node scripts/docker-smoke.mjs
      - name: Recreate containers while retaining the database volume
        run: |
          docker compose down
          docker compose up -d --wait --wait-timeout 180
      - name: Verify saved readings survived recreation
        run: node scripts/docker-smoke.mjs persistence
      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Remove disposable CI containers and data
        if: always()
        run: docker compose down --volumes --remove-orphans
