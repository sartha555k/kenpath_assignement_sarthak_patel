x-api: &api-common
  image: sweety-api:local
  build:
    context: .
    dockerfile: server/Dockerfile
  init: true
  environment: &api-environment
    NODE_ENV: production
    PORT: 4000
    POSTGRES_USER: ${POSTGRES_USER:-sweety}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
    POSTGRES_DB: ${POSTGRES_DB:-sweety}
    JWT_SECRET: ${JWT_SECRET:-}
    JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sweety}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sweety}
      POSTGRES_DB: ${POSTGRES_DB:-sweety}
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - sweety_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  migrate:
    <<: *api-common
    command: ["node", "server/scripts/migrate.js"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api-common
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: client/Dockerfile
      args:
        APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
        restart: true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

volumes:
  sweety_pgdata:
